<!-- login.component.html — FormsModule must be imported in the module -->
<div class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <h2>Welcome back</h2>
      <p>Sign in with your FakeStore credentials</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="user.username"
          required
          minlength="2"
          #usernameInput="ngModel"
          placeholder="e.g. mor_2314"
        />
        <div *ngIf="usernameInput.invalid && usernameInput.touched" class="field__error">
          <span *ngIf="usernameInput.errors?.['required']">Username is required</span>
          <span *ngIf="usernameInput.errors?.['minlength']">Min 2 characters</span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="user.password"
          required
          #passwordInput="ngModel"
          placeholder="Min. 8 characters"
        />
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="field__error">
          <span *ngIf="passwordInput.errors?.['required']">Password is required</span>
        </div>
      </div>

      <div *ngIf="loginForm.errors?.['loginFailed']" class="form-error">
        Invalid email or password. Please try again.
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</div>
